[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "talkpage"
version = "0.1.0"
description = "Local web pages where the user marks items and writes comments, and a waiting coding agent is woken to answer"
readme = "README.en.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yusuke Yamazaki" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["agent", "review", "checklist", "local", "web"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/yus988/talkpage"
Issues = "https://github.com/yus988/talkpage/issues"

[project.scripts]
talkpage = "talkpage:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
talkpage = ["*.js", "*.css"]
